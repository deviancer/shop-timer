<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="宝岛音游社计时工具 - 扫码即可记录到店时长">
    <title>🎮 宝岛音游社计时工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- 页面标题栏 -->
        <header class="app-header">
            <h1>🎮 宝岛音游社计时工具</h1>
            <p class="subtitle">自助扫码 · 轻松计时</p>
        </header>

        <!-- 店铺公告信息 -->
        <div class="shop-notice">
            <p>🎲 只打桌游和麻将<strong>32元封顶</strong></p>
            <p>🧊 饮料价格详见冰箱标注，有疑问可咨询群主</p>
        </div>

        <!-- 隐私模式提示 -->
        <div id="privacy-warning" class="privacy-warning">
            ⚠️ 检测到您正在使用隐私/无痕模式，计时数据可能无法保留。请使用普通模式访问。
        </div>

        <!-- 错误提示 Toast -->
        <div id="error-toast" class="error-toast"></div>

        <!-- ===== 加载视图 ===== -->
        <div id="loading-view" class="view card active">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p class="loading-text">正在加载...</p>
            </div>
        </div>

        <!-- ===== 空闲视图（未入场） ===== -->
        <div id="idle-view" class="view card">
            <p class="status-text">欢迎光临，点击下方按钮开始计时 👇</p>
            <button id="start-btn" class="btn btn-start">
                ⏱ 开始计时
            </button>
        </div>

        <!-- ===== 计时中视图（已入场） ===== -->
        <div id="active-view" class="view card">
            <p class="status-text active-status">✅ 已入场，正在计时...</p>
            <div id="timer-display" class="timer-display">00 : 00 : 00</div>
            <button id="stop-btn" class="btn btn-stop">
                ⏹ 结束计时
            </button>
            <p id="start-time-text" class="time-info"></p>
        </div>

        <!-- ===== 结束视图 ===== -->
        <div id="done-view" class="view card">
            <p class="status-text">🎉 本次计时已结束</p>
            <div id="duration-display" class="duration-display"></div>
            <div id="price-display" class="price-display">
                <span class="price-label">本次消费</span>
                <span id="price-amount" class="price-amount"></span>
            </div>
            <div class="time-info">
                <p id="done-start-time"></p>
                <p id="done-end-time"></p>
            </div>
            <button id="restart-btn" class="btn btn-restart">
                🔄 重新开始
            </button>
        </div>

        <!-- 页脚 -->
        <footer class="app-footer">
            <p>Powered by <a href="https://deviancer.github.io" target="_blank">Deviancer</a></p>
        </footer>
    </div>

    <!-- CDN 加载超时检测：如果 SDK 长时间未加载，显示错误提示 -->
    <script>
    (function(){
        var timer = setTimeout(function(){
            if(typeof supabase==='undefined'){
                var lv=document.getElementById('loading-view');
                if(lv) lv.innerHTML=
                    '<div style="text-align:center;padding:40px">'+
                    '<p style="color:#da3633;font-size:1.1em">⚠️ 页面资源加载失败</p>'+
                    '<p style="color:#8b949e;font-size:0.85em;margin-top:10px">网络连接异常，请刷新重试</p>'+
                    '<button onclick="location.reload()" style="margin-top:20px;padding:12px 36px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer">刷新页面</button>'+
                    '</div>';
            }
        }, 15000);
        window.__cdnOk=function(){ clearTimeout(timer); };
    })();
    </script>
    <!-- Supabase JS SDK：主 CDN + 备用 CDN 自动回退 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
        onload="window.__cdnOk()"
        onerror="this.onerror=null;this.src='https://registry.npmmirror.com/@supabase/supabase-js@2/dist/umd/supabase.js'"></script>
    <!-- 应用逻辑 -->
    <script src="app.js"></script>

</body>
</html>
